function addL(id,lid){const l=pf.ls.find(x=>x.id==lid);if(l&&!l.ids.includes(id)){l.ids.push(id);save();toast("Roʻyxatga qoʻshildi")}}
function addC(id){const t=$('#ci').value.trim().slice(0,300);if(!t)return;db.cm.push({id:uid(),a:id,e:me.e,n:pf.un||pf.n,t,b:[...(pf.bd||[])],c:Date.now()});save();det(id,1)}
async function play(id,i){const a=find(id),e=a&&a.e[i];if(!e)return toast("Qism yoʻq");pf.hs=pf.hs.filter(h=>h.id!=id||h.ep!=i);pf.hs.unshift({id,ep:i,t:Date.now()});pf.hs=pf.hs.slice(0,50);save();const src=await resolveVideo(e.u);const next=a.e[i+1];ov(`<div class="sh"><div class="pkt"><a onclick="det('${id}',1)">${ic('back',24)}</a><span style="font-size:16px">${esc(a.t)}</span></div>${src?`<video controls autoplay playsinline style="width:100%;display:block;max-height:60vh;background:#000" src="${esc(src)}"></video>`:'<div class="nv">Video fayli yoki manzili qoʻshilmagan</div>'}<div class="watch-info"><div class="watch-title">${esc(a.t)}</div><div class="watch-name">E${i+1} - ${esc(e.t)}</div><div class="watch-meta">${esc(a.age)} • ${a.dub?'Dub ':''}${a.sub?'• Sub':''}</div></div><div class="watch-tools"><div class="like-group"><span class="like-btn">${ic('up',26)} 28.5K</span><span class="like-btn">${ic('down',26)} 548</span></div><span>${ic('down',25)}</span><span>${ic('dots',25)}</span></div><div class="player-next"><div class="advisory"><h4>Content Advisory</h4><p>${esc(a.age)}<br>Violence, language or other advisory information can appear here.</p></div><h3>Next Episode</h3>${next?`<div class="player-episode" onclick="play('${id}',${i+1})"><div class="thumb"><div style="width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(145deg,#333,#111)">${ic('play',28)}</div></div><div><b>${i+2}. ${esc(next.t)}</b><small class="mu">${next.d?esc(next.d)+' min':''}</small></div></div>`:'<p class="mu">Bu oxirgi qism.</p>'}<div style="text-align:center;color:var(--ac);font-weight:800;padding:22px" onclick="det('${id}',1)">All Episodes</div></div></div>`)}

const anl=()=>db.anime.filter(a=>a.t.toLowerCase().includes(aq.toLowerCase())).map(a=>`<div class="ar"><div class="th">${pic(a,1)}</div><div class="ai"><b>${esc(a.t)}</b><small>${a.e.length} qism • ${a.v} koʻrish${a.hide?' • yashirin':''}</small></div><div class="ab">${abt(`em('${a.id}')`,'film')}${abt(`tg('${a.id}','hero')`,'star',a.hero)}${abt(`publishAnime('${a.id}')`,'upload')+abt(`tg('${a.id}','hide')`,a.hide?'eyeoff':'eye')}${abt(`af('${a.id}')`,'edit')}${abt(`cf('Oʻchirishni tasdiqlang',()=>delA('${a.id}'))`,'trash')}</div></div>`).join('')||'<p class="mu px">Anime yoʻq</p>';
const sl=(k,l,mn,mx)=>`<div class="r2" style="cursor:default"><span>${l}</span><input type="range" min="${mn}" max="${mx}" value="${db.ui[k]}" oninput="uiS('${k}',+this.value)" style="width:45%;accent-color:var(--ac)"></div>`,cl=(k,l)=>`<div class="r2" style="cursor:default"><span>${l}</span><input type="color" value="${db.ui[k]}" oninput="uiS('${k}',this.value)" style="width:44px;height:30px;border:0;background:none"></div>`;

const txS=(k,v)=>{db.ui.tx[k]=un(v);save();toast('Saqlandi')};
const DV={

el:()=>sc('Pastki menyu')+[['home','Bosh'],['lists','Roʻyxat'],['browse','Koʻrish'],['sim','Simulkast']].map(([k,t])=>tg2(t,db.ui.navs[k],`db.ui.navs['${k}']=db.ui.navs['${k}']?0:1;save();render()`)).join('')+sc('Bosh sahifa qatorlari')+[['hs','Davom ettirish'],['pop','Eng mashhur'],['cur','Joriy mavsum'],['new','Yangi qoʻshilgan']].map(([k,t])=>tg2(t,db.ui.rows[k],`db.ui.rows['${k}']=db.ui.rows['${k}']?0:1;save();render()`)).join('')+sc('Boshqa')+tg2('Ochilish ekrani (splash)',db.ui.splash!==0,'db.ui.splash=db.ui.splash===0?1:0;save();render()')+tg2('Matnni ilovada bevosita tahrirlash',EM,"EM=EM?0:1;go('home')")+`<p class="mu px" style="font-size:13px;margin-top:8px">Rejim yoqilganda ilovadagi punktir bilan oʻralgan istalgan matnni bosib oʻzgartiring.</p>`,
tx:()=>Object.keys(TX).map(k=>`<div class="ia"><label class="mu" style="font-size:12px">${k}</label><input class="ul" style="margin-bottom:6px;padding:8px 2px;font-size:15px" value="${esc(nl2(db.ui.tx[k]!=null?db.ui.tx[k]:TX[k]))}" onchange="txS('${k}',this.value)"></div>`).join('')+`<div class="ia"><p class="mu" style="font-size:12px">Yangi qator: /n</p><button class="bt o" onclick="db.ui.tx={};save();render()">Matnlarni asliga qaytarish</button></div>`,
css:()=>`<div class="ia"><div class="h3" style="padding-left:0">Maxsus CSS</div><textarea class="ta" id="ccs" rows="10" placeholder=".cd h4{color:red}">${esc(db.ui.css)}</textarea><button class="bt" onclick="db.ui.css=$('#ccs').value;applyUI();save();toast('Qoʻllandi')">Qoʻllash</button></div>`,
js:()=>`<div class="ia"><div class="h3" style="padding-left:0">Maʼlumot</div><p class="mu">Xotira: ${(JSON.stringify(db).length/1024).toFixed(0)} KB</p><textarea class="ta" id="raw" rows="9">${esc(JSON.stringify(db,null,1))}</textarea><button class="bt" onclick="applyRaw()">JSON ni qoʻllash</button><button class="bt o" onclick="cf('Demo anime qayta yuklansinmi?',()=>{db.anime=seed().anime;save()})">Demo anime</button><button class="bt o" onclick="cf('Hamma narsa oʻchiriladi!',()=>{db=fix(seed());applyUI();me=null;pf=null;save();ls.s('cz_me',null);welcome()})">Hammasini tozalash</button></div>`};
const chipR=(u,i,r)=>`<a class="chip ${(u.roles||[]).includes(r)?'on':''}" onclick="rl(${i},'${r}')">${r=='admin'?'admin':'dev'}</a>`;
const A={
dash:()=>{const eps=db.anime.reduce((s,a)=>s+a.e.length,0),v=db.anime.reduce((s,a)=>s+a.v,0),mx=Math.max(1,...db.anime.map(a=>a.v));return `<div class="st">${[['Anime',db.anime.length],['Qism',eps],['Foydalanuvchi',db.users.length],["Koʻrishlar",v],['Izohlar',db.cm.length],['Nishonlar',BP.length+db.badges.length]].map(([k,n])=>`<div><b>${n}</b><small>${k}</small></div>`).join('')}</div><div class="h3">Top 5</div>`+[...db.anime].sort((a,b)=>b.v-a.v).slice(0,5).map(a=>`<div class="ar"><div class="ai"><b>${esc(a.t)}</b><div style="height:6px;border-radius:3px;margin-top:6px;background:var(--ac);width:${Math.round(a.v/mx*100)}%"></div></div><small>${a.v}</small></div>`).join('')},
an:()=>`<div class="ia"><p class="mu">Publish qilingan anime barcha ulangan foydalanuvchilarda koʻrinadi.</p></div><div class="rwf"><input class="ul" style="padding:10px 2px;font-size:15px" placeholder="Qidirish" value="${esc(aq)}" oninput="aq=this.value;$('#al').innerHTML=anl()"><button class="bt sm" onclick="af()">+ Anime</button></div><div id="al" style="margin-top:10px">${anl()}</div>`,
us:()=>`<div class="ia"><button class="bt" onclick="addAdmin()">+ Admin qoʻshish</button></div>`+db.users.map((u,i)=>{const lock=u.e==DEV||u.e==me.e,prot=R(u).length&&!isD();return `<div class="ar"><div class="ai"><b>${esc(u.e)}</b><small>${u.profs.length} profil</small><div>${rb(u)}${u.ban?'<span class="bd">ban</span>':''}</div></div>${lock||prot?'':`<div class="ab">${isD()?chipR(u,i,'admin')+chipR(u,i,'developer'):''}${abt(`rpw(${i})`,'key')}${abt(`bn(${i})`,u.ban?'tick':'ban')}${abt(`cf('Foydalanuvchi oʻchirilsinmi?',()=>du(${i}))`,'trash')}</div>`}</div>`}).join('')||'<p class="mu px">Foydalanuvchi yoʻq</p>',
bd:()=>`<div class="ia"><button class="bt" onclick="ep=null;bcR=()=>{ov('');render()};bcV()">+ Nishon yaratish</button><p class="mu" style="font-size:13px">Rol nishonlari: ${nb({n:'admin',c:'#ffffff',i:'check'})}${nb({n:'dev',c:'#5cc8ff',i:'code'})} — avtomatik, boshqalar ishlata olmaydi.</p></div><div class="bgd">${allB().map(b=>`<div class="bq"><div class="bi" style="background:${esc(b.c)};color:${lum(b.c)>165?'#000':'#fff'}">${ic(b.i,24)}</div>${esc(b.n)}${b.id[0]=='c'?`<a class="dl" onclick="cf('Nishon oʻchirilsinmi?',()=>delB('${b.id}'))">${ic('trash',14)}</a>`:''}</div>`).join('')}</div>`,
nw:()=>`<div class="ia"><div class="h3" style="padding-left:0">Eʼlon (hamma sahifada chiqadi)</div><textarea class="ta" id="anx" rows="3">${esc(db.cfg.announce)}</textarea><button class="bt" onclick="db.cfg.announce=$('#anx').value.trim();log('Elon yangilandi');save();render()">Saqlash</button><button class="bt o" onclick="db.cfg.announce='';save();render()">Tozalash</button></div>`,
cm:()=>db.cm.slice().reverse().map(c=>`<div class="ar"><div class="ai"><b>${esc(c.n)}</b><small>${esc((find(c.a)||{}).t||'')}</small><p style="margin-top:2px">${esc(c.t)}</p></div><div class="ab">${abt(`dc('${c.id}')`,'trash')}</div></div>`).join('')||'<p class="mu px">Izoh yoʻq</p>',
lg:()=>db.log.map(l=>`<div class="ar"><div class="ai"><small>${new Date(l.t).toLocaleString()}</small>${esc(l.u)}: ${esc(l.a)}</div></div>`).join('')||'<p class="mu px">Jurnal boʻsh</p>',
st:()=>[['reg',"Roʻyxatdan oʻtish ochiq"],['comments','Izohlar yoqilgan'],['maint','Texnik ishlar rejimi']].map(([k,t])=>tg2(t,db.cfg[k],`db.cfg['${k}']=db.cfg['${k}']?0:1;log('Sozlama: ${k}');save();render()`)).join('')+`<div class="ia"><div class="h3" style="padding-left:0">Zaxira nusxa (JSON)</div><textarea class="ta" rows="4" readonly>${esc(JSON.stringify({anime:db.anime,cfg:db.cfg}))}</textarea><textarea class="ta" id="im" rows="3" placeholder="JSON ni shu yerga qoʻying"></textarea><button class="bt" onclick="imp()">Import</button></div>`,
dv:()=>`<div class="tabs" style="margin-top:4px">${[['ui','Dizayn'],['el','Elementlar'],['tx','Matnlar'],['css','CSS'],['js','Maʼlumot']].map(([k,t])=>`<a class="${dvt==k?'on':''}" onclick="dvt='${k}';render()">${t}</a>`).join('')}</div>`+DV[dvt]()};

function chooseIcon(id){if(!isD())return toast('Faqat developer iconni oʻzgartira oladi');db.ui.icon=id;setAppIcon(id);log('Ilova iconi: '+id);save();render()}
function iconFile(inp){if(!isD())return;const f=inp.files[0];if(!f||!f.type.startsWith('image/'))return toast('Rasm fayli kerak');const r=new FileReader();r.onload=()=>{db.ui.customIcon=r.result;db.ui.icon='custom';setAppIcon('custom');save();render();toast('Maxsus icon saqlandi')};r.readAsDataURL(f)}
function addAdmin(){if(!isD())return toast('Faqat developer admin qoʻsha oladi');ask('Admin emailini kiriting',e=>{e=e.trim().toLowerCase();const u=db.users.find(x=>x.e==e);if(!u)return toast('Avval shu email bilan hisob yaratilgan boʻlsin');u.roles=u.roles||[];if(!u.roles.includes('admin'))u.roles.push('admin');log('Admin qoʻshildi: '+e);save();render()})}
function friendsData(){const e=me.e;db.friends[e]=db.friends[e]||{friends:[],in:[],out:[]};return db.friends[e]}
function addFriend(){ask('Doʻstning username yoki emaili',q=>{q=q.trim().toLowerCase();const u=db.users.find(x=>x.e==q||x.profs.some(p=>p.un.toLowerCase()==q));if(!u||u.e==me.e)return toast('Foydalanuvchi topilmadi');const f=friendsData();if(f.friends.includes(u.e))return toast('Allaqachon doʻst');db.friends[u.e]=db.friends[u.e]||{friends:[],in:[],out:[]};if(!db.friends[u.e].in.includes(me.e))db.friends[u.e].in.push(me.e);f.out.push(u.e);save();toast('Doʻstlik soʻrovi yuborildi');render()})}
function acceptFriend(e){const a=friendsData();db.friends[e]=db.friends[e]||{friends:[],in:[],out:[]};a.in=a.in.filter(x=>x!=e);a.friends.includes(e)||a.friends.push(e);db.friends[e].out=(db.friends[e].out||[]).filter(x=>x!=me.e);db.friends[e].friends=db.friends[e].friends||[];db.friends[e].friends.includes(me.e)||db.friends[e].friends.push(me.e);save();render()}
function openChat(e){db.messages[me.e+'|'+e]=db.messages[me.e+'|'+e]||[];db.messages[e+'|'+me.e]=db.messages[e+'|'+me.e]||[];ov(`<div class="sh"><div class="pkt"><a onclick="ov('');render()">${ic('back')}</a><span>${esc(e)}</span></div><div class="chat-box" id="chatbox">${db.messages[me.e+'|'+e].map(m=>`<div class="bubble ${m.e==me.e?'me':''}">${esc(m.t)}</div>`).join('')}</div><div class="fb"><div class="rwf"><input class="ul" id="msgin" placeholder="Xabar yozing"><button class="bt sm" onclick="sendMsg('${esc(e)}')">${ic('send',18)}</button></div></div></div>`)}
function sendMsg(e){const t=$('#msgin').value.trim();if(!t)return;db.messages[me.e+'|'+e].push({e:me.e,t,c:Date.now()});db.messages[e+'|'+me.e].push({e:me.e,t,c:Date.now()});save();openChat(e)}
function friendsV(){const f=friendsData();const inc=(f.in||[]).map(e=>`<div class="friend-row"><span>${esc(e)}</span><button class="bt sm" onclick="acceptFriend('${esc(e)}')">Qabul</button></div>`).join('');const fr=(f.friends||[]).map(e=>`<div class="friend-row"><span class="mav">${esc((e[0]||'?').toUpperCase())}</span><b style="flex:1">${esc(e)}</b><button class="bt sm" onclick="openChat('${esc(e)}')">Yozish</button><button class="bt o sm" onclick="roomCreate('${esc(e)}')">Birga koʻrish</button></div>`).join('');return `<div class="pkt"><span>Doʻstlar va chat</span><button class="bt sm" onclick="addFriend()">+ Doʻst</button></div>${inc?`<div class="sc">Soʻrovlar</div>${inc}`:''}<div class="sc">Doʻstlar</div>${fr||'<p class="mu px">Hali doʻst yoʻq.</p>'}`}
function roomCreate(friend){const a=vis()[0];if(!a)return toast('Anime yoʻq');const code=uid().toUpperCase();db.rooms[code]={host:me.e,guest:friend,anime:a.id,ep:0,playing:0,t:Date.now()};save();roomV(code)}
function roomV(code){const r=db.rooms[code];if(!r)return toast('Xona topilmadi');const a=find(r.anime);ov(`<div class="sh"><div class="pkt"><a onclick="ov('');render()">${ic('back')}</a><span>Birga koʻrish</span></div><div class="room-card"><b>Xona: ${esc(code)}</b><p class="mu" style="margin-top:6px">Doʻstingizga xona kodini yuboring.</p></div>${a?`<div class="room-video"><video id="roomvid" controls playsinline src="${esc(a.e[r.ep]?.u||'')}"></video><span class="room-sync">E${r.ep+1}</span></div><div class="ia"><button class="bt" onclick="roomNext('${code}')">Keyingi qism</button><button class="bt o" onclick="toast('Xona kodi: ${esc(code)}')">Kodni ko‘rsatish</button></div>`:''}</div>`)}
function roomNext(code){const r=db.rooms[code];if(!r)return;r.ep++;save();roomV(code)}
function publishAnime(id){if(!isA())return;const a=find(id);if(!a)return;a.published=1;a.hide=0;a.publishedAt=Date.now();log('Anime publish: '+a.t);save();toast('Anime hammaga chiqarildi');render()}
function unpublishAnime(id){if(!isA())return;const a=find(id);if(!a)return;a.published=0;a.hide=1;save();render()}

function admin(){if(!isA())return acc();const TT=Object.keys(NM).filter(k=>k!='dv'||isD());if(!TT.includes(adm))adm='dash';const out=`<div class="pkt"><a onclick="go('acc')">${ic('back')}</a><span>${adm=='dv'?'Developer panel':'Admin panel'}</span></div><div class="tb">${TT.map(k=>`<a class="${adm==k?'on':''}" onclick="adm='${k}';render()">${ic(IC[k],16)}${NM[k]}</a>`).join('')}</div>`+A[adm]();return out}
const tg=(id,k)=>{const a=find(id);a[k]=a[k]?0:1;save();render()};
const delA=id=>{db.anime=db.anime.filter(a=>a.id!=id);log("Anime oʻchirildi");save()};
const dc=id=>{db.cm=db.cm.filter(c=>c.id!=id);save();render()};
function rl(i,r){const u=db.users[i];if(!isD())return;u.roles=u.roles||[];const k=u.roles.indexOf(r);k<0?u.roles.push(r):u.roles.splice(k,1);log(`Rol: ${u.e} ${r}`);save();render()}
function bn(i){const u=db.users[i];if(R(u).length&&!isD())return toast("Ruxsat yoʻq");u.ban=u.ban?0:1;log('Ban: '+u.e);save();render()}
function du(i){const u=db.users[i];if(u.e==DEV||(R(u).length&&!isD()))return toast("Ruxsat yoʻq");db.users.splice(i,1);log("Oʻchirildi: "+u.e);save()}
function rpw(i){const u=db.users[i];ask(`${esc(u.e)} uchun yangi parol`,v=>{if(v.length<6||/\s/.test(v))return toast('Parol 6+ belgi, probelsiz');u.pw=hs(v);log('Parol tiklandi: '+u.e);save();toast('Parol yangilandi')},'password')}
function imp(){try{const j=JSON.parse($('#im').value);if(!Array.isArray(j.anime))throw 0;db.anime=j.anime;if(j.cfg)Object.assign(db.cfg,j.cfg);log('Import');save();render();toast('Import tayyor')}catch(e){toast("JSON notoʻgʻri")}}
function applyRaw(){if(!isD())return;try{const j=JSON.parse($('#raw').value);if(!j.anime||!j.users||!j.cfg)throw 0;db=fix(j);applyUI();me=db.users.find(u=>u.e==me.e)||me;pf=me.profs.find(p=>p.id==pf.id)||me.profs[0];log('Raw JSON');save();render();toast("Qoʻllandi")}catch(e){toast("JSON notoʻgʻri")}}
function af(id){const a=id?find(id):{t:'',d:'',g:[],ty:'series',s:SEAS[0],age:'16+',sub:1,dub:0,poster:'',e:[]};tmpP=a.poster||'';fid=id||'';
ov(`<div class="sh"><div class="pkt"><a onclick="ov('')">${ic('x')}</a><span>${id?'Animeni tahrirlash':'Yangi anime'}</span></div><div class="ia"><input class="ul" id="f_t" placeholder="Nomi" value="${esc(a.t)}"><textarea class="ta" id="f_d" rows="3" placeholder="Tavsif">${esc(a.d)}</textarea><input class="ul" id="f_g" placeholder="Janrlar (vergul bilan)" value="${esc(a.g.join(', '))}"><div class="rwf" style="padding:0"><select class="ta" id="f_ty"><option value="series" ${a.ty=='series'?'selected':''}>Serial</option><option value="movie" ${a.ty=='movie'?'selected':''}>Film</option><option value="music" ${a.ty=='music'?'selected':''}>Musiqa</option></select><select class="ta" id="f_s">${SEAS.map(s=>`<option ${s==a.s?'selected':''}>${s}</option>`).join('')}</select><input class="ta" id="f_a" value="${esc(a.age)}" style="width:80px"></div><label class="ck"><input type="checkbox" id="f_sub" ${a.sub?'checked':''}> Subtitrli</label><label class="ck" style="margin-top:0"><input type="checkbox" id="f_dub" ${a.dub?'checked':''}> Dublyajli</label><p class="mu">Poster (fayl yoki URL)</p><input type="file" accept="image/*" onchange="upl(this)" class="ta"><input class="ul" id="f_p" placeholder="Poster URL (ixtiyoriy)" value="${esc((a.poster||'').startsWith('data:')?'':a.poster)}"><p class="mu">Qismlar (har qatorda: Nomi | video URL | daqiqa)</p><textarea class="ta" id="f_e" rows="5">${esc(a.e.map(e=>e.t+' | '+e.u+' | '+(e.d||'')).join('\n'))}</textarea><button class="bt" onclick="saveA()">Saqlash</button>${id?`<button class="bt o" onclick="em('${id}')"><span class="i">${ic('film',18)}Qismlarni boshqarish</span></button>`:''}</div></div>`)}
function upl(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=300;c.height=Math.round(300*im.height/im.width);c.getContext('2d').drawImage(im,0,0,c.width,c.height);tmpP=c.toDataURL('image/jpeg',.7);toast('Poster tayyor')};im.src=r.result};r.readAsDataURL(f)}
function saveA(){const t=$('#f_t').value.trim();if(!t)return toast('Nomi kerak');
const e=$('#f_e').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split('|').map(x=>x.trim());return{t:p[0],u:p[1]||'',d:p[2]||''}});
const d={t,d:$('#f_d').value,g:$('#f_g').value.split(',').map(x=>x.trim()).filter(Boolean),ty:$('#f_ty').value,s:$('#f_s').value,age:$('#f_a').value||'16+',sub:$('#f_sub').checked?1:0,dub:$('#f_dub').checked?1:0,poster:$('#f_p').value.trim()||tmpP,e};
if(fid)Object.assign(find(fid),d);else db.anime.unshift({id:uid(),hero:0,hide:0,published:1,v:0,c:Date.now(),...d});
log((fid?'Tahrir: ':"Qoʻshildi: ")+t);save();ov('');render()}
function em(id,ei){ei=ei==null?-1:ei;emi=id;eix=ei;const a=find(id),e=ei>=0?a.e[ei]:{t:'',u:'',d:''};
ov(`<div class="sh"><div class="pkt"><a onclick="ov('');render()">${ic('back')}</a><span style="font-size:16px">${esc(a.t)} — qismlar</span></div>${a.e.map((x,i)=>`<div class="ar"><div class="ai"><b>${i+1}. ${esc(x.t)}</b><small>${esc(x.u||'video yoʻq')}${x.d?' • '+esc(x.d)+' daq':''}</small></div><div class="ab">${abt(`mvE('${id}',${i},-1)`,'up')}${abt(`mvE('${id}',${i},1)`,'dn')}${abt(`em('${id}',${i})`,'edit')}${abt(`cf('Qism oʻchirilsinmi?',()=>delE('${id}',${i}))`,'trash')}</div></div>`).join('')||'<p class="mu px">Qism yoʻq</p>'}<div class="ia"><div class="h3" style="padding-left:0">${ei>=0?(ei+1)+'-qismni tahrirlash':'Yangi qism qoʻshish'}</div><input class="ul" id="e_t" placeholder="Qism nomi" value="${esc(e.t)}"><input class="ul" id="e_u" placeholder="Video URL (mp4 / m3u8)" value="${esc(e.u.startsWith('idb:')?'':e.u)}"><input type="file" accept="video/*" class="ta" onchange="pickedVideo=this.files[0]"><small class="mu" style="display:block;margin:6px 0 14px">Video faylini toʻgʻridan-toʻgʻri tanlashingiz mumkin. Katta fayllar brauzer xotirasida saqlanadi.</small><input class="ul" id="e_d" placeholder="Davomiyligi (daqiqa)" value="${esc(e.d)}"><button class="bt" onclick="saveE()">${ei>=0?'Saqlash':'Qism qoʻshish'}</button>${ei>=0?`<button class="bt o" onclick="em('${id}')">Bekor qilish</button>`:''}</div></div>`)}
async function saveE(){const a=find(emi);let u=$('#e_u').value.trim();if(pickedVideo){try{u=await upVideo(pickedVideo)}catch(e){return toast('Video yuklanmadi')}pickedVideo=null}const o={t:$('#e_t').value.trim()||((eix>=0?eix:a.e.length)+1)+'-qism',u,d:$('#e_d').value.trim()};if(eix>=0)a.e[eix]=o;else a.e.push(o);log(`Qism: ${a.t} #${(eix>=0?eix:a.e.length-1)+1}`);save();em(emi)}
function mvE(id,i,d){const a=find(id),j=i+d;if(j<0||j>=a.e.length)return;[a.e[i],a.e[j]]=[a.e[j],a.e[i]];save();em(id)}
function delE(id,i){find(id).e.splice(i,1);save();em(id)}
applyUI();splash();

var SHR=null,SHW=false,SHT=0,SHA=0;
function pushCl(){if(!SHR||!SHW||SHA||typeof isA!=='function'||!isA())return;clearTimeout(SHT);SHT=setTimeout(async()=>{try{await SHR.set({anime:db.anime,v:Date.now()})}catch(e){toast("Umumiy bazaga yozilmadi")}},900)}
(async()=>{try{const c=window.claude&&await claude.use('db');if(!c)return;const u=await claude.use('user');try{SHW=!!(u&&await u.can('data.write'))}catch(e){}
SHR=c.doc('cz/shared');SHR.onSnapshot(sn=>{if(FB)return;if(!sn.exists){pushCl();return}const d=sn.data();if(!d||!Array.isArray(d.anime))return;if(typeof isA==='function'&&isA()&&SHW)return;SHA=1;diffToast(db.anime,d.anime);db.anime=d.anime;ls.s('cz_db2',db);SHA=0;if(me&&pf&&!document.querySelector('#ov>*,.dlg'))render()},()=>{})}catch(e){}})();

function pushSh(){pushCl();pushFb()}
function diffToast(o,n){try{if(typeof isA==='function'&&isA())return;const m=new Map(o.map(a=>[a.id,a.e.length]));for(const a of n){const k=m.get(a.id);if(k!=null&&a.e.length>k)return toast('Yangi qism: '+a.t+' — '+a.e[a.e.length-1].t);if(k==null&&o.length&&a.published!==0)return toast('Yangi anime: '+a.t)}}catch(e){}}
/* ---- Firebase (real-time, Google/Telegram login) ---- */
var FB=null,FBH={},FBT=0,FBF=1;
const fbReady=()=>{const c=window.FIREBASE_CONFIG;return !!(c&&c.apiKey&&!/YOUR_/i.test(c.apiKey))};
const loadJS=u=>new Promise((r,j)=>{const x=document.createElement('script');x.src=u;x.onload=r;x.onerror=j;document.head.appendChild(x)});
async function fbInit(){if(!fbReady())return;const b='https://www.gstatic.com/firebasejs/10.12.2/';await loadJS(b+'firebase-app-compat.js');await Promise.all([loadJS(b+'firebase-auth-compat.js'),loadJS(b+'firebase-firestore-compat.js'),loadJS(b+'firebase-storage-compat.js')]);firebase.initializeApp(FIREBASE_CONFIG);FB={a:firebase.auth(),f:firebase.firestore(),s:firebase.storage()};
FB.f.collection('anime').onSnapshot(sn=>{if(sn.metadata.hasPendingWrites)return;if(sn.empty){if(isA())pushFb();return}const old=db.anime;let m=new Map(FBF?[]:db.anime.map(a=>[a.id,a]));
(FBF?sn.docs.map(d=>({type:'added',doc:d})):sn.docChanges()).forEach(c=>{const id=c.doc.id;if(c.type==='removed'){m.delete(id);delete FBH[id];return}let a;try{a=JSON.parse(c.doc.data().j)}catch(e){return}FBH[id]=c.doc.data().j;m.set(id,a)});FBF=0;
db.anime=[...m.values()].sort((a,b)=>(b.c||0)-(a.c||0));diffToast(old,db.anime);ls.s('cz_db2',db);if(me&&pf&&stage!=='p'&&!$('#ov').innerHTML&&!$('#dg').innerHTML)render()},e=>toast('Baza bilan aloqa yoʻq'))}
function pushFb(){if(!FB||!isA())return;clearTimeout(FBT);FBT=setTimeout(async()=>{if(!FB.a.currentUser){if(!pushFb.w){pushFb.w=1;toast('Umumiy bazaga yozish uchun Google bilan kiring')}return}try{const b=FB.f.batch(),ids=new Set(db.anime.map(a=>a.id));let n=0;db.anime.forEach(a=>{const j=JSON.stringify(a);if(FBH[a.id]!==j){b.set(FB.f.collection('anime').doc(a.id),{j,u:Date.now()});FBH[a.id]=j;n++}});Object.keys(FBH).forEach(id=>{if(!ids.has(id)){b.delete(FB.f.collection('anime').doc(id));delete FBH[id];n++}});if(isD())db.users.forEach(x=>{if((x.roles||[]).includes('admin'))b.set(FB.f.collection('admins').doc(x.e),{on:1})});if(n)await b.commit()}catch(e){toast('Bazaga yozilmadi (ruxsat yoki hajm)')}},900)}
async function fbLogin(e,name){e=e.toLowerCase();let u=db.users.find(x=>x.e==e);if(!u){if(!db.cfg.reg&&e!=DEV)return toast('Roʻyxatdan oʻtish yopiq');u={e,pw:null,roles:[],ban:0,c:Date.now(),cell:1,profs:[Object.assign(newProf((name||e.split('@')[0]).slice(0,20)),{un:'user'+uid().slice(0,5),bd:['b0']})]};db.users.push(u)}
if(u.ban)return toast('Hisob bloklangan');try{const d=await FB.f.collection('admins').doc(e).get();if(d.exists&&!(u.roles||[]).includes('admin')){u.roles=(u.roles||[]).concat('admin')}}catch(x){}
me=u;ls.s('cz_me',e);save();log('Kirdi (bulut)');pickV(0,0)}
async function googleLogin(){if(!FB)return toast('Firebase hali ulanmagan');try{const r=await FB.a.signInWithPopup(new firebase.auth.GoogleAuthProvider());fbLogin(r.user.email,r.user.displayName)}catch(e){toast('Google bilan kirib boʻlmadi')}}
async function tgAuth(u){try{const r=await (await fetch(FIREBASE_CONFIG.TELEGRAM_FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(u)})).json();await FB.a.signInWithCustomToken(r.token);fbLogin('tg'+u.id+'@telegram.local',r.name)}catch(e){toast('Telegram orqali kirib boʻlmadi')}}
const _authV=authV;authV=function(r){_authV(r);const h=document.querySelector('.au h2');if(!h||!fbReady())return;const tg=FIREBASE_CONFIG.TELEGRAM_BOT&&FIREBASE_CONFIG.TELEGRAM_FN;h.insertAdjacentHTML('afterend','<div class="soc"><button class="bt o" onclick="googleLogin()"><b style="font-size:18px;color:#4aa3ff">G</b> Google bilan davom etish</button>'+(tg?'<div id="tgw"></div>':'')+'</div><div class="or">yoki email bilan</div>');if(tg){const x=document.createElement('script');x.src='https://telegram.org/js/telegram-widget.js?22';x.async=true;x.dataset.telegramLogin=FIREBASE_CONFIG.TELEGRAM_BOT;x.dataset.size='large';x.dataset.radius='14';x.dataset.onauth='tgAuth(user)';x.dataset.requestAccess='write';$('#tgw').appendChild(x)}};
/* ---- tezkor joylash ---- */
function qp(){if(!isA())return;ov(`<div class="sh"><div class="pkt"><a onclick="ov('')">${ic('x')}</a><span style="font-size:16px">Tezkor joylash</span></div><div class="fl"><label>Anime</label><select class="ul" id="q_a" onchange="qpS()"><option value="">+ Yangi anime</option>${db.anime.map(a=>`<option value="${a.id}">${esc(a.t)}</option>`).join('')}</select><div id="q_new"><input class="ul" id="q_t" placeholder="Anime nomi"><input class="ul" id="q_p" placeholder="Poster URL"><input class="ul" id="q_g" placeholder="Janrlar (vergul bilan)"><textarea class="ta" id="q_d" rows="3" placeholder="Qisqa tavsif"></textarea></div><label>Qism</label><input class="ul" id="q_e" placeholder="Qism nomi (masalan 1-qism)"><input class="ul" id="q_u" placeholder="Video URL (mp4 / m3u8)"><input class="ul" id="q_m" placeholder="Davomiyligi (daqiqa)"><small>Hammada koʻrinishi uchun video havolasi (URL) kiriting.</small><button class="bt" onclick="qpGo()">Joylash</button></div></div>`);qpS()}
function qpS(){$('#q_new').style.display=$('#q_a').value?'none':'block'}
function qpGo(){const id=$('#q_a').value,u=$('#q_u').value.trim();if(!u)return toast('Video havolasini kiriting');let a=id&&find(id);if(!a){const t=$('#q_t').value.trim();if(!t)return toast('Anime nomi kerak');a={id:uid(),hero:0,hide:0,published:1,v:0,c:Date.now(),t,d:$('#q_d').value,g:$('#q_g').value.split(',').map(x=>x.trim()).filter(Boolean),ty:'TV',s:SEAS[0],age:'16+',sub:1,dub:0,poster:$('#q_p').value.trim(),e:[]};db.anime.unshift(a)}
a.e.push({t:$('#q_e').value.trim()||(a.e.length+1)+'-qism',u,d:$('#q_m').value.trim()});log('Tezkor joylandi: '+a.t);save();ov('');render();toast('Joylandi — hammada real time koʻrinadi')}
const _render=render;render=function(){const vc=window.__lv!==view+'|'+stage;window.__lv=view+'|'+stage;_render();const A=$('#app');if(vc&&A){A.classList.remove('pgin');void A.offsetWidth;A.classList.add('pgin');clearTimeout(window.__pt);window.__pt=setTimeout(()=>A.classList.remove('pgin'),1000)}const f=$('#fab');if(f)f.classList.toggle('on',!!(me&&pf&&typeof isA==='function'&&isA()&&stage!=='p'))};

function avFile(inp){const f=inp.files[0];if(!f||!f.type.startsWith('image/'))return toast('Rasm fayli kerak');const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,256,256);ep.av=c.toDataURL('image/jpeg',.82);URL.revokeObjectURL(u);epv();toast('Rasm tanlandi — Saqlashni bosing')};im.onerror=()=>toast('Rasmni ochib boʻlmadi');im.src=u}
const _epv=epv;epv=function(){_epv();const e=document.querySelector('.ed');if(e)e.insertAdjacentHTML('afterend',`<div class="upr"><label class="bt o sm upl">${ic('plus',16)} Rasm yuklash<input type="file" accept="image/*" hidden onchange="avFile(this)"></label>${/^data:image/.test(ep.av||'')?`<button class="bt o sm" onclick="ep.av='flake';epv()">Rasmni olib tashlash</button>`:''}</div>`)};
async function upVideo(f){if(FB&&FB.s&&FB.a.currentUser){const r=FB.s.ref('videos/'+uid()+'-'+f.name.replace(/[^\w.]/g,'_')),t=r.put(f);t.on('state_changed',s=>toast('Yuklanmoqda '+Math.round(s.bytesTransferred/s.totalBytes*100)+'%'));await t;return await r.getDownloadURL()}
try{const A=window.claude&&await claude.use('assets');if(A){toast('Yuklanmoqda...');const r=await A.upload(f);return r.url}}catch(e){}
toast('Video faqat shu qurilmada saqlandi (umumiy xotira ulanmagan)');return await vdb.put(f)}
const _qp=qp;qp=function(){_qp();const l=document.querySelector('#q_u');if(l)l.insertAdjacentHTML('afterend','<label class="mu vf">yoki videoni qurilmadan tanlang</label><input type="file" id="q_f" accept="video/*" class="ta">')};
qpGo=async function(){const id=$('#q_a').value;let u=$('#q_u').value.trim();const f=$('#q_f')&&$('#q_f').files[0];if(!u&&!f)return toast('Video havolasi yoki fayl kerak');let a=id&&find(id);if(!a){const t=$('#q_t').value.trim();if(!t)return toast('Anime nomi kerak');a={id:uid(),hero:0,hide:0,published:1,v:0,c:Date.now(),t,d:$('#q_d').value,g:$('#q_g').value.split(',').map(x=>x.trim()).filter(Boolean),ty:'TV',s:SEAS[0],age:'16+',sub:1,dub:0,poster:$('#q_p').value.trim(),e:[]}}
const nm=$('#q_e').value.trim()||(a.e.length+1)+'-qism',dd=$('#q_m').value.trim();try{if(f)u=await upVideo(f)}catch(e){return toast('Video yuklanmadi')}
if(!id)db.anime.unshift(a);a.e.push({t:nm,u,d:dd});log('Tezkor joylandi: '+a.t);save();ov('');render();toast('Joylandi')};
if('serviceWorker' in navigator&&location.protocol.indexOf('http')==0){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
fbInit().catch(()=>{});
