name: Unzip upload
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          z=$(ls *.zip | head -1)
          unzip -o "$z" -x ".github/*"
          rm "$z"
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "Unzip $z"
          git push
